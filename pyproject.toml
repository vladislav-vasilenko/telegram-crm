[project]
name = "telegram-dialogue-crm"
version = "0.1.0"
description = "Local Telegram inbox analysis with Telethon and a Russian web dashboard"
requires-python = ">=3.11"
dependencies = [
  "telethon==1.45.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "openai>=2,<3",
  "anthropic>=1.17,<2",
  "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
telegram-crm = "telegram_crm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_crm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

